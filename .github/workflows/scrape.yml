name: Scheduled scrape

# Runs on GitHub's servers, so it works while your computer is off.
on:
  schedule:
    - cron: "30 18 1,11,21 * *"   # 18:30 UTC = 00:00 IST on the 2nd, 12th and 22nd (about every 10 days)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
    inputs:
      full:
        description: "Full scrape (re-scrape every title and every episode)"
        type: boolean
        default: false
      test:
        description: "Quick test: home page + 5 titles, files only (no database)"
        type: boolean
        default: false

# Never run two scrapes at once.
concurrency:
  group: nightly-scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-24.04   # Playwright 1.60 does not support 26.04 (ubuntu-latest) yet
    timeout-minutes: 350     # GitHub's hard limit is 360

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build HotstarScraper.csproj -c Release

      - name: Install Chromium
        run: pwsh bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Scrape
        env:
          HOTSTAR_DB: ${{ secrets.HOTSTAR_DB }}
          TEST: ${{ inputs.test && 'yes' || '' }}
          FULL: ${{ inputs.full && '--full' || '' }}
        run: |
          if [ -n "$TEST" ]; then
            HOTSTAR_DB= dotnet bin/Release/net8.0/HotstarScraper.dll --max-titles 5
            exit $?
          fi
          if [ -z "$HOTSTAR_DB" ]; then
            echo "::warning::No HOTSTAR_DB secret yet (Settings > Secrets and variables > Actions) - skipping the scrape."
            exit 0
          fi
          dotnet bin/Release/net8.0/HotstarScraper.dll $FULL

      # run.json, promotions.csv and quality.txt of every run, kept for 14 days.
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: scrape-${{ github.run_number }}
          path: output/
          retention-days: 14
          if-no-files-found: ignore
