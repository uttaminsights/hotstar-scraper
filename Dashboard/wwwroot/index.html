<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Hotstar Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <aside class="rail" id="rail">
    <div class="logo">HS<span>Dashboard</span></div>
    <nav>
      <a href="#overview" data-page="overview">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"/></svg><span>Overview</span></a>
      <a href="#movies" data-page="movies">
        <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM8 4v16M16 4v16M4 8h4M4 12h4M4 16h4M16 8h4M16 12h4M16 16h4"/></svg><span>Movies</span></a>
      <a href="#shows" data-page="shows">
        <svg viewBox="0 0 24 24"><path d="M3 6h18v12H3zM8 21h8M12 18v3M8 2l4 4 4-4"/></svg><span>TV Shows</span></a>
      <a href="#home" data-page="home">
        <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg><span>Home Page</span></a>
      <a href="#runs" data-page="runs">
        <svg viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M4.9 4.9l2.8 2.8M16.3 16.3l2.8 2.8M3 12h4M17 12h4M4.9 19.1l2.8-2.8M16.3 7.7l2.8-2.8"/></svg><span>Runs</span><i class="dot" id="runDot" hidden></i></a>
    </nav>
    <div class="rail-run" id="railRun"></div>
  </aside>

  <main id="main"></main>
  <div class="toast" id="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
